<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSD Control Plane</title>
  <style>
    /* ── Reset + base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #22263a;
      --border:      #2e3349;
      --text:        #e2e8f0;
      --muted:       #64748b;
      --accent:      #6366f1;

      --healthy:     #22c55e;
      --errored:     #ef4444;
      --blocked:     #f97316;
      --awaiting:    #eab308;
      --question:    #a855f7;

      --done-col:    #22263a;
      --active-col:  #1e2535;

      --header-h:    52px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .logo {
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tab-bar {
      display: flex;
      gap: 2px;
    }

    .tab {
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: transparent;
      transition: color 0.15s, background 0.15s;
    }

    .tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .attention-badge {
      background: var(--errored);
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--healthy);
    }

    .status-dot.stale { background: var(--muted); }

    /* ── Instance filter dropdown ─────────────────────────────── */
    #instance-filter {
      position: relative;
    }

    #inst-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      cursor: pointer;
      transition: border-color 0.15s;
      white-space: nowrap;
    }

    #inst-filter-btn:hover { border-color: var(--accent); }
    #inst-filter-btn.filtered { border-color: var(--accent); color: var(--accent); }

    #inst-filter-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 500;
      min-width: 200px;
      padding: 6px 0;
    }

    #inst-filter-dropdown.open { display: block; }

    .inst-dd-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text);
      transition: background 0.1s;
    }

    .inst-dd-item:hover { background: var(--surface2); }

    .inst-dd-item.select-all {
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3px;
      padding-bottom: 9px;
    }

    .inst-dd-check {
      width: 14px; height: 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .inst-dd-check.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .inst-dd-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Days filter ──────────────────────────────────────────── */
    .days-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .days-filter select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 6px;
      cursor: pointer;
      outline: none;
    }

    .days-filter select:hover {
      border-color: var(--accent);
    }

    .add-instance-btn {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-instance-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Add-instance modal ───────────────────────────────────── */
    #add-instance-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    #add-instance-overlay.visible { display: flex; }

    #add-instance-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #add-instance-modal h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .field-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .field-input:focus { border-color: var(--accent); }
    .field-input.error { border-color: var(--errored); }

    .field-hint {
      font-size: 10px;
      color: var(--muted);
    }

    #add-instance-error {
      font-size: 11px;
      color: var(--errored);
      background: #2a0a0a;
      border-radius: 5px;
      padding: 7px 10px;
      display: none;
    }

    #add-instance-error.visible { display: block; }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-cancel:hover { border-color: var(--accent); color: var(--text); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    #last-updated {
      color: var(--muted);
      font-size: 11px;
    }

    /* ── Main layout ──────────────────────────────────────────── */
    main {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
    }

    /* ── Instance sidebar ─────────────────────────────────────── */
    #instance-sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-header-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sidebar-add-btn {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .sidebar-add-btn:hover { border-color: var(--accent); color: var(--accent); }

    .inst-node {
      border-bottom: 1px solid var(--border);
    }

    .inst-node-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px 7px;
      cursor: default;
    }

    .inst-node-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .inst-node-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inst-node-type {
      font-size: 9px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 3px;
      padding: 1px 5px;
      flex-shrink: 0;
    }

    .inst-delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .inst-delete-btn:hover { color: var(--errored); }

    .inst-sessions {
      padding: 0 0 6px 0;
    }

    .session-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px 5px 24px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s;
    }

    .session-row:hover { background: var(--surface2); }

    .session-row-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .session-row-dot.attached { background: var(--healthy); }
    .session-row-dot.detached { background: var(--muted); }
    .session-row-dot.shell    { background: var(--accent); }

    .session-row-name {
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-row-meta {
      font-size: 10px;
      color: var(--muted);
    }

    .inst-new-session-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 24px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      transition: color 0.15s;
    }

    .inst-new-session-btn:hover { color: var(--accent); }

    /* ── Board view (phase columns only) ──────────────────────── */
    #board-view {
      display: flex;
      gap: 0;
      flex: 1;
      height: 100%;
      overflow-x: auto;
      padding: 0;
    }

    .phase-column {
      flex: 1 1 0;
      min-width: 160px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .phase-column:last-child { border-right: none; }

    .col-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .col-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .col-count {
      margin-left: auto;
      background: var(--surface2);
      border-radius: 8px;
      padding: 1px 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .col-cards {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* ── Milestone card ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .card.done {
      background: var(--done-col);
      opacity: 0.65;
    }

    .card.done:hover { opacity: 0.85; }

    /* left accent bar colour by attention; falls back to instance color via CSS var */
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--card-bar-color, var(--healthy));
    }

    .card[data-attention="Errored"]::before    { background: var(--errored); }
    .card[data-attention="Blocked"]::before    { background: var(--blocked); }
    .card[data-attention="AwaitingVerification"]::before { background: var(--awaiting); }
    .card[data-attention="QuestionPending"]::before { background: var(--question); }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-id {
      font-size: 10px;
      color: var(--muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .instance-chip {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .instance-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .attention-pip {
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: auto;
    }

    .attention-pip.Errored    { background: #3f1010; color: var(--errored); }
    .attention-pip.Blocked    { background: #3f2010; color: var(--blocked); }
    .attention-pip.AwaitingVerification { background: #3a330a; color: var(--awaiting); }
    .attention-pip.QuestionPending { background: #2e1a3a; color: var(--question); }

    .slice-bar {
      margin-top: 8px;
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .slice-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .slice-progress {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Queue view ───────────────────────────────────────────── */
    #queue-view {
      display: none;
      padding: 20px;
      flex: 1;
      height: 100%;
      overflow-y: auto;
    }

    #queue-view.visible { display: block; }

    .queue-empty {
      color: var(--muted);
      text-align: center;
      margin-top: 60px;
      font-size: 13px;
    }

    .queue-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .queue-item:hover { border-color: var(--accent); }

    .queue-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .queue-dot.Errored    { background: var(--errored); }
    .queue-dot.Blocked    { background: var(--blocked); }
    .queue-dot.AwaitingVerification { background: var(--awaiting); }
    .queue-dot.QuestionPending { background: var(--question); }

    .queue-body { flex: 1; min-width: 0; }
    .queue-title { font-weight: 500; margin-bottom: 4px; font-size: 13px; }

    .queue-detail {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-meta {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    /* ── Slide-over panel ─────────────────────────────────────── */
    #panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }

    #panel-overlay.visible { display: block; }

    #side-panel {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 480px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .panel-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }

    .panel-close:hover { color: var(--text); }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }

    .panel-section {
      margin-bottom: 20px;
    }

    .panel-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .slice-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .slice-row:last-child { border-bottom: none; }

    .slice-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .slice-status-dot.complete   { background: var(--healthy); }
    .slice-status-dot.in_progress { background: var(--accent); }
    .slice-status-dot.pending    { background: var(--border); }
    .slice-status-dot.skipped    { background: var(--muted); }

    .slice-info { flex: 1; min-width: 0; }
    .slice-title-text { font-size: 12px; font-weight: 500; }
    .slice-meta-text  { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .task-mini-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0 4px 18px;
    }

    .task-check {
      font-size: 11px;
      color: var(--healthy);
    }

    .task-check.pending { color: var(--border); }

    .task-title-text { font-size: 11px; color: var(--muted); }

    .runtime-block {
      background: var(--surface2);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      gap: 4px;
    }

    .pill.Executing  { background: #1e2a4a; color: #7c9ef8; }
    .pill.Done       { background: var(--surface2); color: var(--muted); }
    .pill.Discussing { background: #1a2a2a; color: #5eead4; }
    .pill.Researching { background: #2a1a2a; color: #e879f9; }
    .pill.Planning   { background: #1a2a1a; color: #86efac; }
    .pill.Validating { background: #2a2a1a; color: #fde68a; }

    .vscode-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e3a5f;
      color: #60a5fa;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .vscode-link:hover { background: #1e4a7f; }

    /* ── Terminal panel ───────────────────────────────────────── */
    .terminal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--surface2);
      color: var(--text);
    }

    .terminal-btn:hover { border-color: var(--accent); background: #1a1f35; }

    /* Session picker — inside slide-over */
    #session-picker {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    #session-picker.visible { display: flex; }

    .session-picker-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .session-item:hover { border-color: var(--accent); }

    .session-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .session-dot.attached { background: var(--healthy); }
    .session-dot.detached { background: var(--muted); }

    .session-name {
      font-size: 12px;
      font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .session-meta {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── Full-screen terminal overlay ─────────────────────────── */
    #terminal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0d1117;
      flex-direction: column;
    }

    #terminal-overlay.visible { display: flex; }

    #terminal-overlay-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 40px;
      background: #161b22;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #terminal-overlay-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #terminal-overlay-session {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--healthy);
      background: #0a2a1e;
      border-radius: 4px;
      padding: 1px 7px;
    }

    #terminal-overlay-back {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    #terminal-overlay-back:hover { border-color: var(--accent); color: var(--text); }

    #terminal-overlay-pick {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    #terminal-overlay-pick:hover { border-color: var(--accent); color: var(--text); }

    #ttyd-frame {
      flex: 1;
      border: none;
      background: #0d1117;
      width: 100%;
      height: 100%;
    }

    /* ── Quick task chip ─────────────────────────────────────── */
    .quick-divider {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 4px 4px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .quick-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      transition: border-color 0.15s;
    }

    .quick-chip:hover { border-color: var(--accent); }

    .quick-chip-icon {
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--muted);
    }

    .quick-chip-body { flex: 1; min-width: 0; }

    .quick-chip-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-chip-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Journal events ───────────────────────────────────────── */
    .journal-row {
      display: flex;
      gap: 8px;
      padding: 4px 0;
      font-size: 11px;
    }

    .journal-ts { color: var(--muted); font-family: monospace; flex-shrink: 0; }
    .journal-type { color: var(--accent); flex-shrink: 0; }
    .journal-unit { color: var(--muted); }

    /* ── Offline banner ───────────────────────────────────────── */
    .offline-card {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">G</div>
  <h1>GSD Control Plane</h1>
  <div class="tab-bar">
    <button class="tab active" id="tab-board" onclick="switchTab('board')">Board</button>
    <button class="tab" id="tab-queue" onclick="switchTab('queue')">
      Attention <span class="attention-badge" id="queue-count">0</span>
    </button>
  </div>
  <div class="header-right">
    <div id="instance-filter">
      <button id="inst-filter-btn" onclick="toggleInstFilter(event)">
        Instances <span id="inst-filter-label">all</span> ▾
      </button>
      <div id="inst-filter-dropdown"></div>
    </div>
    <div class="days-filter">
      <label for="done-days">Done:</label>
      <select id="done-days" onchange="applyFilter()">
        <option value="1">Last 24h</option>
        <option value="7" selected>Last 7d</option>
        <option value="30">Last 30d</option>
        <option value="0">All time</option>
      </select>
    </div>
    <div class="status-dot" id="status-dot"></div>
    <span id="last-updated">—</span>
  </div>
</header>

<main>
  <div id="instance-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-header-title">Instances</span>
      <button class="sidebar-add-btn" onclick="openAddInstance()">+ Add</button>
    </div>
    <div id="sidebar-instances"></div>
  </div>
  <div id="board-view"></div>
  <div id="queue-view"></div>
</main>

<!-- Add instance modal -->
<div id="add-instance-overlay" onclick="maybeCloseAddInstance(event)">
  <div id="add-instance-modal">
    <h2>Add local instance</h2>
    <div class="field-group">
      <label class="field-label" for="ai-name">Display name</label>
      <input class="field-input" id="ai-name" type="text" placeholder="myproject" autocomplete="off" />
      <span class="field-hint">Letters, numbers, dashes, underscores only</span>
    </div>
    <div class="field-group">
      <label class="field-label" for="ai-path">Project directory</label>
      <input class="field-input" id="ai-path" type="text" placeholder="/Users/you/projects/myapp" autocomplete="off" spellcheck="false" />
      <span class="field-hint">Must contain a <code>.gsd/</code> directory</span>
    </div>
    <div id="add-instance-error"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddInstance()">Cancel</button>
      <button class="btn-primary" id="ai-submit" onclick="submitAddInstance()">Add instance</button>
    </div>
  </div>
</div>

<!-- Slide-over -->
<div id="panel-overlay" onclick="closePanel(event)">
  <div id="side-panel">
    <div class="panel-header">
      <div>
        <div style="font-size:14px;font-weight:600" id="panel-title">—</div>
        <div style="margin-top:4px;display:flex;gap:6px;align-items:center" id="panel-meta"></div>
      </div>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div id="session-picker">
      <div class="session-picker-label">Choose tmux session</div>
      <div id="session-list"></div>
    </div>
  </div>
</div>

<!-- Full-screen terminal overlay — outside the slide-over -->
<div id="terminal-overlay">
  <div id="terminal-overlay-bar">
    <span id="terminal-overlay-title">—</span>
    <span id="terminal-overlay-session">—</span>
    <button id="terminal-overlay-pick" onclick="repickSession()" title="Switch session">⇄ Switch session</button>
    <button id="terminal-overlay-back" onclick="closeTerminal()">← Back to board</button>
  </div>
  <iframe id="ttyd-frame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
</div>

<script>
const PHASES = ['Discussing','Researching','Planning','Executing','Validating','Done']
const API    = 'http://localhost:3001/api/instances'
const POLL   = 5000

let currentData = null
let selectedCard = null
let currentTab   = 'board'

// ── Instance color palette ───────────────────────────────────────────────────
// Assigned by order of first appearance. Colors are visually distinct on dark bg.

const INSTANCE_PALETTE = [
  { color: '#38bdf8', bg: '#0c2a3a' },  // sky blue   — remote/pod instances
  { color: '#a78bfa', bg: '#1e1535' },  // violet     — local instances
  { color: '#34d399', bg: '#0a2a1e' },  // emerald
  { color: '#fb923c', bg: '#2a1a0a' },  // orange
  { color: '#f472b6', bg: '#2a0a1e' },  // pink
]

const instanceColorMap = new Map() // name → palette entry

function getInstanceColor(name) {
  if (!instanceColorMap.has(name)) {
    const idx = instanceColorMap.size % INSTANCE_PALETTE.length
    instanceColorMap.set(name, INSTANCE_PALETTE[idx])
  }
  return instanceColorMap.get(name)
}

// ── Add instance modal ───────────────────────────────────────────────────────

function openAddInstance() {
  document.getElementById('ai-name').value = ''
  document.getElementById('ai-path').value = ''
  document.getElementById('ai-name').classList.remove('error')
  document.getElementById('ai-path').classList.remove('error')
  document.getElementById('add-instance-error').classList.remove('visible')
  document.getElementById('add-instance-overlay').classList.add('visible')
  setTimeout(() => document.getElementById('ai-name').focus(), 50)
}

function closeAddInstance() {
  document.getElementById('add-instance-overlay').classList.remove('visible')
}

function maybeCloseAddInstance(e) {
  if (e.target === document.getElementById('add-instance-overlay')) closeAddInstance()
}

async function submitAddInstance() {
  const name      = document.getElementById('ai-name').value.trim()
  const localPath = document.getElementById('ai-path').value.trim()
  const errEl     = document.getElementById('add-instance-error')
  const btn       = document.getElementById('ai-submit')

  // Clear previous errors
  errEl.classList.remove('visible')
  document.getElementById('ai-name').classList.remove('error')
  document.getElementById('ai-path').classList.remove('error')

  if (!name) {
    document.getElementById('ai-name').classList.add('error')
    errEl.textContent = 'Name is required'
    errEl.classList.add('visible')
    return
  }
  if (!localPath) {
    document.getElementById('ai-path').classList.add('error')
    errEl.textContent = 'Path is required'
    errEl.classList.add('visible')
    return
  }

  btn.disabled = true
  btn.textContent = 'Adding…'

  try {
    const res  = await fetch('/api/instances', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, localPath })
    })
    const data = await res.json()

    if (!res.ok) {
      document.getElementById('ai-path').classList.add('error')
      errEl.textContent = data.error || 'Unknown error'
      errEl.classList.add('visible')
      return
    }

    closeAddInstance()
    // Trigger an immediate poll so the new instance appears on the board
    await poll()
  } catch (e) {
    errEl.textContent = `Request failed: ${e.message}`
    errEl.classList.add('visible')
  } finally {
    btn.disabled = false
    btn.textContent = 'Add instance'
  }
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('add-instance-overlay').classList.contains('visible')) {
    submitAddInstance()
  }
  if (e.key === 'Escape') {
    closeAddInstance()
    closePanel()
    closeTerminal()
  }
})

// ── Instance filter dropdown ──────────────────────────────────────────────────

const FILTER_KEY      = 'gsd-cp-hidden-instances'
const hiddenInstances = new Set(
  (() => { try { return JSON.parse(localStorage.getItem(FILTER_KEY) || '[]') } catch { return [] } })()
)

function persistFilter() {
  try { localStorage.setItem(FILTER_KEY, JSON.stringify([...hiddenInstances])) } catch {}
}
let _filterInstances  = []  // last known instance list

function toggleInstFilter(e) {
  e.stopPropagation()
  document.getElementById('inst-filter-dropdown').classList.toggle('open')
}

// Close on outside click
document.addEventListener('click', () => {
  document.getElementById('inst-filter-dropdown').classList.remove('open')
})

function renderInstanceFilter(instances) {
  _filterInstances = instances
  const dropdown = document.getElementById('inst-filter-dropdown')
  const btn      = document.getElementById('inst-filter-btn')
  const label    = document.getElementById('inst-filter-label')

  // Rebuild dropdown
  dropdown.innerHTML = ''

  // "Select all" row
  const allVisible  = instances.every(i => !hiddenInstances.has(i.name))
  const allRow      = document.createElement('div')
  allRow.className  = 'inst-dd-item select-all'
  allRow.innerHTML  = `
    <span class="inst-dd-check ${allVisible ? 'checked' : ''}">
      ${allVisible ? '✓' : ''}
    </span>
    <span>Select all</span>
  `
  allRow.addEventListener('click', e => {
    e.stopPropagation()
    if (allVisible) {
      // Deselect all except first
      instances.slice(1).forEach(i => hiddenInstances.add(i.name))
    } else {
      hiddenInstances.clear()
    }
    persistFilter()
    renderInstanceFilter(instances)
    if (currentData) render(currentData)
  })
  dropdown.appendChild(allRow)

  // Per-instance rows
  for (const inst of instances) {
    const icolor  = getInstanceColor(inst.name)
    const checked = !hiddenInstances.has(inst.name)
    const row     = document.createElement('div')
    row.className = 'inst-dd-item'
    row.innerHTML = `
      <span class="inst-dd-check ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</span>
      <span class="inst-dd-dot" style="background:${icolor.color}"></span>
      <span>${esc(inst.name)}</span>
    `
    row.addEventListener('click', e => {
      e.stopPropagation()
      const visible = instances.filter(i => !hiddenInstances.has(i.name))
      if (checked && visible.length <= 1) return  // can't hide last
      if (checked) {
        hiddenInstances.add(inst.name)
      } else {
        hiddenInstances.delete(inst.name)
      }
      persistFilter()
      renderInstanceFilter(instances)
      if (currentData) render(currentData)
    })
    dropdown.appendChild(row)
  }

  // Update button label + filtered state
  const visibleCount = instances.filter(i => !hiddenInstances.has(i.name)).length
  const isFiltered   = visibleCount < instances.length
  label.textContent  = isFiltered ? `${visibleCount}/${instances.length}` : 'all'
  btn.classList.toggle('filtered', isFiltered)
}

// ── Instance sidebar ─────────────────────────────────────────────────────────

// Cache of sessions per instance — refreshed on each poll via /api/terminal
const sidebarSessions = new Map()  // instName → [{ name, windows, attached }] | null

function renderSidebar(instances) {
  const container = document.getElementById('sidebar-instances')
  container.innerHTML = ''

  for (const inst of instances) {
    const icolor   = getInstanceColor(inst.name)
    const isPod    = !!inst.pod
    const sessions = sidebarSessions.get(inst.name) ?? []

    const node = document.createElement('div')
    node.className = 'inst-node'

    // Header row
    const hdr = document.createElement('div')
    hdr.className = 'inst-node-header'
    hdr.innerHTML = `
      <span class="inst-node-dot" style="background:${icolor.color}"></span>
      <span class="inst-node-name" title="${esc(inst.name)}">${esc(inst.name)}</span>
      <span class="inst-node-type">${isPod ? 'pod' : 'local'}</span>
      <button class="inst-delete-btn" title="Remove instance"
        onclick="deleteInstance(event, ${JSON.stringify(inst.name)})">✕</button>
    `
    node.appendChild(hdr)

    // Sessions list
    const sessEl = document.createElement('div')
    sessEl.className = 'inst-sessions'

    if (isPod && sessions.length === 0) {
      // Haven't fetched yet — fetch silently
      fetchSidebarSessions(inst.name)
    }

    for (const s of sessions) {
      const row = document.createElement('div')
      row.className = 'session-row'
      row.innerHTML = `
        <span class="session-row-dot ${s.attached ? 'attached' : 'detached'}"></span>
        <span class="session-row-name">${esc(s.name)}</span>
        <span class="session-row-meta">${s.windows}w</span>
      `
      row.addEventListener('click', () => openTerminalTab(inst.name, s.name))
      sessEl.appendChild(row)
    }

    // Local: always show a "shell" entry
    if (!isPod) {
      const row = document.createElement('div')
      row.className = 'session-row'
      row.innerHTML = `
        <span class="session-row-dot shell"></span>
        <span class="session-row-name">shell</span>
        <span class="session-row-meta">local</span>
      `
      row.addEventListener('click', () => openTerminalTab(inst.name, 'shell'))
      sessEl.appendChild(row)
    }

    // + New session button (pod only — local always has shell)
    if (isPod) {
      const btn = document.createElement('button')
      btn.className = 'inst-new-session-btn'
      btn.textContent = '+ New session'
      btn.addEventListener('click', () => promptNewSession(inst.name))
      sessEl.appendChild(btn)
    }

    node.appendChild(sessEl)
    container.appendChild(node)
  }
}

async function fetchSidebarSessions(instName) {
  try {
    const res  = await fetch(`/api/terminal/${encodeURIComponent(instName)}`)
    const data = await res.json()
    if (data.sessions) {
      sidebarSessions.set(instName, data.sessions)
      if (currentData) renderSidebar(currentData.instances)
    }
  } catch {}
}

function openTerminalTab(instName, sessionName) {
  const url = sessionName === 'shell'
    ? `/terminal-page/${encodeURIComponent(instName)}`
    : `/terminal-page/${encodeURIComponent(instName)}?session=${encodeURIComponent(sessionName)}`
  window.open(url, `term-${instName}-${sessionName}`)
}

async function promptNewSession(instName) {
  const sessionName = prompt(`New tmux session name for ${instName}:`, 'steering')
  if (!sessionName) return

  try {
    const res  = await fetch(`/api/terminal/${encodeURIComponent(instName)}/session`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ sessionName })
    })
    const data = await res.json()
    if (!res.ok) { alert(`Error: ${data.error}`); return }
    // Refresh sessions and open terminal tab
    await fetchSidebarSessions(instName)
    openTerminalTab(instName, sessionName)
  } catch (e) {
    alert(`Failed: ${e.message}`)
  }
}

async function deleteInstance(e, instName) {
  e.stopPropagation()
  const btn = e.currentTarget
  if (btn.dataset.confirming !== 'yes') {
    btn.dataset.confirming = 'yes'
    btn.textContent = 'Sure?'
    btn.style.color = 'var(--errored)'
    setTimeout(() => {
      if (btn.dataset.confirming === 'yes') {
        btn.dataset.confirming = ''
        btn.textContent = '✕'
        btn.style.color = ''
      }
    }, 3000)
    return
  }
  btn.dataset.confirming = ''
  try {
    const res = await fetch(`/api/instances/${encodeURIComponent(instName)}`, { method: 'DELETE' })
    if (!res.ok) { const d = await res.json(); alert(d.error); return }
    sidebarSessions.delete(instName)
    hiddenInstances.delete(instName)
    persistFilter()
    await poll()
  } catch (err) {
    alert(`Failed: ${err.message}`)
  }
}

// ── Days filter ──────────────────────────────────────────────────────────────

function getDoneDays() {
  return parseInt(document.getElementById('done-days').value, 10)
}

function isWithinDoneWindow(dateStr) {
  const days = getDoneDays()
  if (days === 0) return true // all time
  if (!dateStr) return false
  const d = new Date(dateStr)
  if (isNaN(d)) return false
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000
  return d.getTime() >= cutoff
}

function applyFilter() {
  if (currentData) render(currentData)
}

// ── Fetch + render loop ──────────────────────────────────────────────────────

async function poll() {
  try {
    const res  = await fetch(API)
    const json = await res.json()
    currentData = json
    render(json)
    document.getElementById('status-dot').className = 'status-dot'
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date(json.serverTime).toLocaleTimeString()
  } catch(e) {
    document.getElementById('status-dot').className = 'status-dot stale'
    document.getElementById('last-updated').textContent = 'Offline'
  }
}

setInterval(poll, POLL)
poll()

// ── Tab switching ────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab
  document.getElementById('tab-board').classList.toggle('active', tab === 'board')
  document.getElementById('tab-queue').classList.toggle('active', tab === 'queue')
  document.getElementById('board-view').style.display = tab === 'board' ? 'flex' : 'none'
  document.getElementById('queue-view').style.display = tab === 'queue' ? 'block' : 'none'
}

// ── Main render ──────────────────────────────────────────────────────────────

function render(data) {
  const allMilestones = []
  const allQuickTasks = []

  // Seed color map in stable order so colors don't shift on re-render
  for (const inst of data.instances) {
    getInstanceColor(inst.name)
    for (const m of (inst.milestones || [])) {
      allMilestones.push({ ...m, _instance: inst })
    }
    for (const qt of (inst.quickTasks || [])) {
      allQuickTasks.push({ ...qt, _instance: inst })
    }
  }

  // Render instance filter pills (no-op if instance list unchanged)
  renderInstanceFilter(data.instances)

  // Render sidebar tree
  renderSidebar(data.instances)

  // Refresh pod sessions every other poll (they don't change often)
  for (const inst of data.instances) {
    if (inst.pod && !sidebarSessions.has(inst.name)) fetchSidebarSessions(inst.name)
  }

  // Apply instance filter
  const visibleMilestones = allMilestones.filter(m => !hiddenInstances.has(m._instance.name))
  const visibleQuickTasks = allQuickTasks.filter(qt => !hiddenInstances.has(qt._instance.name))

  // Attention count — only visible instances
  const attentionItems = visibleMilestones.filter(m => m.attention && m.attention !== 'Healthy')
  document.getElementById('queue-count').textContent = attentionItems.length

  renderBoard(visibleMilestones, data.instances, visibleQuickTasks)
  renderQueue(attentionItems)

  // Re-render open panel if one is selected
  if (selectedCard) {
    const refreshed = allMilestones.find(m => m.id === selectedCard.id && m._instance.name === selectedCard._instance.name)
    if (refreshed) openPanel(refreshed)
  }
}

// ── Board ─────────────────────────────────────────────────────────────────────

function renderBoard(milestones, instances, quickTasks) {
  const board = document.getElementById('board-view')
  board.innerHTML = ''

  for (const phase of PHASES) {
    let cards = milestones.filter(m => m.phase === phase)

    // Apply Done window filter
    if (phase === 'Done') {
      cards = cards.filter(m => isWithinDoneWindow(m.completed_at))
    }

    // Quick tasks only go in Done
    const phaseQuickTasks = phase === 'Done'
      ? quickTasks.filter(qt => isWithinDoneWindow(qt.date))
      : []

    const totalCount = cards.length + phaseQuickTasks.length

    const col = document.createElement('div')
    col.className = 'phase-column'
    col.innerHTML = `
      <div class="col-header">
        <span class="col-title">${phase}</span>
        <span class="col-count">${totalCount}</span>
      </div>
      <div class="col-cards" id="col-${phase}"></div>
    `
    board.appendChild(col)

    const colEl = col.querySelector('.col-cards')

    // Offline instance banners
    for (const inst of instances) {
      if (phase === 'Executing' && inst.error) {
        const banner = document.createElement('div')
        banner.className = 'offline-card'
        banner.textContent = `${inst.name}: offline`
        colEl.appendChild(banner)
      }
    }

    for (const m of cards) {
      colEl.appendChild(makeCard(m))
    }

    // Quick task chips at bottom of Done
    if (phaseQuickTasks.length > 0) {
      const divider = document.createElement('div')
      divider.className = 'quick-divider'
      divider.textContent = `⚡ Quick Tasks (${phaseQuickTasks.length})`
      colEl.appendChild(divider)

      // Sort by date descending
      const sorted = [...phaseQuickTasks].sort((a, b) =>
        (b.date || '').localeCompare(a.date || '')
      )
      for (const qt of sorted) {
        colEl.appendChild(makeQuickChip(qt))
      }
    }
  }
}

function makeCard(m) {
  const inst   = m._instance
  const slices = (inst.slices || []).filter(s => s.milestone_id === m.id)
  const done   = slices.filter(s => s.status === 'complete' || s.status === 'skipped').length
  const total  = slices.length
  const pct    = total ? Math.round((done / total) * 100) : 0
  const isDone = m.phase === 'Done'
  const icolor = getInstanceColor(inst.name)

  const card = document.createElement('div')
  card.className = 'card' + (isDone ? ' done' : '')
  card.dataset.attention = m.attention || 'Healthy'

  // Use instance color on left bar when Healthy; attention colors override via CSS
  // for non-Healthy states. We set it inline only for Healthy so CSS data-attention
  // selectors still win.
  if (!m.attention || m.attention === 'Healthy') {
    card.style.setProperty('--card-bar-color', icolor.color)
  }

  card.innerHTML = `
    <div class="card-top">
      <span class="card-id">${m.id}</span>
      <span class="card-title">${esc(m.title || '(untitled)')}</span>
    </div>
    <div class="card-meta">
      <span class="instance-chip" style="color:${icolor.color};background:${icolor.bg}">
        <span class="instance-dot" style="background:${icolor.color}"></span>
        ${esc(inst.name)}
      </span>
      ${m.attention && m.attention !== 'Healthy'
        ? `<span class="attention-pip ${m.attention}">${m.attention}</span>`
        : ''}
    </div>
    ${total > 0 ? `
    <div class="slice-bar"><div class="slice-bar-fill" style="width:${pct}%"></div></div>
    <div class="slice-progress">${done}/${total} slices</div>
    ` : ''}
  `

  card.addEventListener('click', () => openPanel(m))
  return card
}

function makeQuickChip(qt) {
  const icolor = getInstanceColor(qt._instance.name)
  const chip = document.createElement('div')
  chip.className = 'quick-chip'
  chip.innerHTML = `
    <span class="quick-chip-icon">⚡</span>
    <div class="quick-chip-body">
      <div class="quick-chip-title">${esc(qt.title || qt.slug || '(quick task)')}</div>
      <div class="quick-chip-meta">
        <span class="instance-chip" style="color:${icolor.color};background:${icolor.bg}">
          <span class="instance-dot" style="background:${icolor.color}"></span>
          ${esc(qt._instance.name)}
        </span>
        ${qt.date ? `<span>· ${esc(qt.date)}</span>` : ''}
        ${qt.branch ? `<span>· ${esc(qt.branch)}</span>` : ''}
      </div>
    </div>
  `
  chip.addEventListener('click', () => openQuickPanel(qt))
  return chip
}

// ── Queue view ────────────────────────────────────────────────────────────────

const URGENCY = { Errored: 0, Blocked: 1, QuestionPending: 2, AwaitingVerification: 3 }

function renderQueue(items) {
  const qv = document.getElementById('queue-view')
  qv.innerHTML = ''

  if (!items.length) {
    qv.innerHTML = '<div class="queue-empty">✓ Nothing needs your attention right now.</div>'
    return
  }

  const sorted = [...items].sort((a,b) =>
    (URGENCY[a.attention] ?? 9) - (URGENCY[b.attention] ?? 9)
  )

  for (const m of sorted) {
    const icolor = getInstanceColor(m._instance.name)
    const qi = document.createElement('div')
    qi.className = 'queue-item'
    qi.innerHTML = `
      <div class="queue-dot ${m.attention}"></div>
      <div class="queue-body">
        <div class="queue-title">${esc(m.id)} — ${esc(m.title || '(untitled)')}</div>
        <div class="queue-detail">${esc(m.attentionDetail || m.attention)}</div>
        <div class="queue-meta">
          <span class="instance-chip" style="color:${icolor.color};background:${icolor.bg}">
            <span class="instance-dot" style="background:${icolor.color}"></span>
            ${esc(m._instance.name)}
          </span>
          <span class="attention-pip ${m.attention}">${m.attention}</span>
        </div>
      </div>
    `
    qi.addEventListener('click', () => {
      switchTab('board')
      openPanel(m)
    })
    qv.appendChild(qi)
  }
}

// ── Slide-over panel ─────────────────────────────────────────────────────────

function openPanel(m) {
  selectedCard = m
  const inst   = m._instance
  const icolor = getInstanceColor(inst.name)
  const slices = (inst.slices || []).filter(s => s.milestone_id === m.id)
  const tasks  = (inst.tasks  || []).filter(t => t.milestone_id === m.id)

  document.getElementById('panel-title').textContent = `${m.id} — ${m.title || '(untitled)'}`

  const meta = document.getElementById('panel-meta')
  meta.innerHTML = `
    <span class="pill ${m.phase}">${m.phase}</span>
    ${m.attention !== 'Healthy' ? `<span class="attention-pip ${m.attention}">${m.attention}</span>` : ''}
    <span class="instance-chip" style="color:${icolor.color};background:${icolor.bg}">
      <span class="instance-dot" style="background:${icolor.color}"></span>
      ${esc(inst.name)}
    </span>
  `

  const body = document.getElementById('panel-body')
  let html = ''

  // VS Code link + terminal button
  const instColor = icolor.color
  let openInHtml = ''
  if (inst.vscodeTunnelUrl) {
    openInHtml += `<a class="vscode-link" href="${esc(inst.vscodeTunnelUrl)}" target="_blank">⬡ Open VS Code</a>`
  }
  openInHtml += `
    <button class="terminal-btn" id="terminal-open-btn"
      onclick='openTerminalForInstance(${JSON.stringify(inst.name)}, ${JSON.stringify(`${m.id} — ${m.title || inst.name}`)})'>
      ⌨ Terminal
    </button>`
  if (openInHtml) {
    html += `
      <div class="panel-section">
        <div class="panel-section-title">Open In</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${openInHtml}</div>
      </div>`
  }

  // Runtime info
  const ps = inst.pausedSession
  if (ps && ps.milestoneId === m.id) {
    html += `
      <div class="panel-section">
        <div class="panel-section-title">Runtime State</div>
        <div class="runtime-block">Unit: ${esc(ps.unitId || '—')}
Paused: ${esc(ps.pausedAt?.slice(0,19) ?? '—')}
Type: ${esc(ps.unitType || '—')}</div>
      </div>`
  }

  // Attention detail
  if (m.attentionDetail) {
    const isError     = m.attention === 'Errored'
    const isQuestion  = m.attention === 'QuestionPending'
    const isTransient = m.attentionDetail.toLowerCase().includes('transient')
    const label = isError ? '⚠ Error Detail'
                : isQuestion ? '💬 Waiting for Input'
                : 'Attention Detail'
    const borderStyle = isError   ? 'border-left:3px solid var(--errored);padding-left:10px'
                      : isQuestion ? 'border-left:3px solid var(--question);padding-left:10px'
                      : ''
    html += `
      <div class="panel-section">
        <div class="panel-section-title">${label}</div>
        <div class="runtime-block" style="${borderStyle}">${esc(m.attentionDetail)}${isTransient ? '\n\n(transient — safe to resume)' : ''}</div>
      </div>`
  }

  // Recent journal events
  const journal = inst.recentJournalEvents || []
  if (journal.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Recent Activity</div>`
    for (const ev of journal.slice(-6)) {
      html += `<div class="journal-row">
        <span class="journal-ts">${(ev.ts||'').slice(11,19)}</span>
        <span class="journal-type">${esc(ev.eventType||'')}</span>
        <span class="journal-unit">${esc(ev.unitId||ev.rule||'')}</span>
      </div>`
    }
    html += `</div>`
  }

  // Slices
  if (slices.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Slices</div>`
    for (const sl of slices.slice().sort((a,b)=>a.sequence-b.sequence)) {
      const slTasks = tasks.filter(t => t.slice_id === sl.id)
      const doneT   = slTasks.filter(t => t.status === 'complete').length
      html += `
        <div class="slice-row">
          <div class="slice-status-dot ${sl.status}"></div>
          <div class="slice-info">
            <div class="slice-title-text">${esc(sl.id)}: ${esc(sl.title || sl.goal?.slice(0,60) || '—')}</div>
            <div class="slice-meta-text">${sl.status}${slTasks.length ? ` · ${doneT}/${slTasks.length} tasks` : ''}</div>
            ${slTasks.map(t => `
              <div class="task-mini-row">
                <span class="task-check ${t.status !== 'complete' ? 'pending' : ''}">${t.status === 'complete' ? '✓' : '○'}</span>
                <span class="task-title-text">${esc(t.one_liner || t.title || '—')}</span>
              </div>`).join('')}
          </div>
        </div>`
    }
    html += `</div>`
  }

  // Vision / goals
  if (m.vision) {
    html += `
      <div class="panel-section">
        <div class="panel-section-title">Vision</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">${esc(m.vision).slice(0,300)}${m.vision.length > 300 ? '…' : ''}</div>
      </div>`
  }

  body.innerHTML = html
  document.getElementById('panel-overlay').classList.add('visible')
}

function closePanel(e) {
  if (e && e.target !== document.getElementById('panel-overlay')) return
  document.getElementById('panel-overlay').classList.remove('visible')
  document.getElementById('session-picker').classList.remove('visible')
  selectedCard = null
}

function openQuickPanel(qt) {
  selectedCard = null
  const icolor = getInstanceColor(qt._instance.name)
  document.getElementById('panel-title').textContent = `⚡ ${qt.title || qt.slug || 'Quick Task'}`

  const meta = document.getElementById('panel-meta')
  meta.innerHTML = `
    <span class="pill Done">Done</span>
    <span class="instance-chip" style="color:${icolor.color};background:${icolor.bg}">
      <span class="instance-dot" style="background:${icolor.color}"></span>
      ${esc(qt._instance.name)}
    </span>
    ${qt.date ? `<span style="color:var(--muted);font-size:11px">· ${esc(qt.date)}</span>` : ''}
  `

  const body = document.getElementById('panel-body')
  let html = ''

  if (qt.branch) {
    html += `
      <div class="panel-section">
        <div class="panel-section-title">Branch</div>
        <div class="runtime-block">${esc(qt.branch)}</div>
      </div>`
  }

  if (qt.summary) {
    html += `
      <div class="panel-section">
        <div class="panel-section-title">What Changed</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-wrap">${esc(qt.summary)}</div>
      </div>`
  }

  if (!qt.summary && !qt.branch) {
    html = '<div style="color:var(--muted);font-size:12px;margin-top:12px">No summary available.</div>'
  }

  body.innerHTML = html
  document.getElementById('panel-overlay').classList.add('visible')
}

// ── Terminal ─────────────────────────────────────────────────────────────────

// localStorage key: gsd-cp-terminal-session:<instanceName> → sessionName
function rememberedSession(instName) {
  try { return localStorage.getItem(`gsd-cp-terminal-session:${instName}`) } catch { return null }
}
function rememberSession(instName, sessionName) {
  try { localStorage.setItem(`gsd-cp-terminal-session:${instName}`, sessionName) } catch {}
}

// State for repick
let terminalState = null  // { instName, cardTitle, sessions, port }

async function openTerminalForInstance(instName, cardTitle) {
  // Fetch sessions + port from server
  let data
  try {
    const res = await fetch(`/api/terminal/${encodeURIComponent(instName)}`)
    data = await res.json()
  } catch (e) {
    alert(`Terminal error: ${e.message}`); return
  }
  if (data.error) { alert(`Terminal error: ${data.error}`); return }

  const { sessions, defaultSession, port, type } = data

  if (type === 'local' && !port) { alert('Local instance terminals not yet supported.'); return }
  if (!port) { alert('No ttyd port available — is ttyd running on the pod?'); return }

  terminalState = { instName, cardTitle: cardTitle || instName, sessions, port }

  // If we have a remembered session and it still exists, use it directly
  const remembered = rememberedSession(instName)
  if (remembered && sessions.some(s => s.name === remembered)) {
    connectToSession(port, remembered, cardTitle)
    return
  }

  // Single session or local (no sessions) → connect immediately
  if (sessions.length <= 1 || type === 'local') {
    const session = sessions[0]?.name ?? defaultSession
    connectToSession(port, type === 'local' ? 'shell' : session, cardTitle)
    return
  }

  // Multiple → show picker in the slide-over panel
  showSessionPicker(sessions, defaultSession, port, cardTitle)
}

function showSessionPicker(sessions, defaultSession, port, cardTitle) {
  const picker  = document.getElementById('session-picker')
  const list    = document.getElementById('session-list')
  list.innerHTML = ''

  for (const s of sessions) {
    const isDefault = s.name === defaultSession
    const item = document.createElement('div')
    item.className = 'session-item'
    item.innerHTML = `
      <span class="session-dot ${s.attached ? 'attached' : 'detached'}"></span>
      <span class="session-name">${esc(s.name)}${isDefault ? ' <span style="color:var(--muted);font-weight:400;font-size:10px">(default)</span>' : ''}</span>
      <span class="session-meta">${s.windows} window${s.windows !== 1 ? 's' : ''} · ${s.attached ? 'attached' : 'detached'}</span>
    `
    item.addEventListener('click', () => {
      picker.classList.remove('visible')
      connectToSession(port, s.name, cardTitle)
    })
    list.appendChild(item)
  }

  picker.classList.add('visible')
}

function repickSession() {
  if (!terminalState) return
  // Reset remembered session so picker shows
  try { localStorage.removeItem(`gsd-cp-terminal-session:${terminalState.instName}`) } catch {}
  // Hide overlay, reopen slide-over panel, show picker
  document.getElementById('terminal-overlay').classList.remove('visible')
  document.getElementById('panel-overlay').classList.add('visible')
  document.getElementById('ttyd-frame').src = 'about:blank'
  showSessionPicker(
    terminalState.sessions,
    rememberedSession(terminalState.instName) ?? terminalState.sessions[0]?.name,
    terminalState.port,
    terminalState.cardTitle
  )
}

function connectToSession(port, sessionName, cardTitle) {
  // Remember the choice (only meaningful for tmux sessions, not plain shells)
  if (terminalState && sessionName !== 'shell') rememberSession(terminalState.instName, sessionName)

  document.getElementById('panel-overlay').classList.remove('visible')
  document.getElementById('session-picker').classList.remove('visible')

  document.getElementById('terminal-overlay-title').textContent = cardTitle || terminalState?.instName || '—'
  document.getElementById('terminal-overlay-session').textContent =
    sessionName === 'shell' ? 'shell' : sessionName

  // For tmux sessions pass ?arg=<session>; for plain shell just load the root URL
  const url = sessionName === 'shell'
    ? `http://localhost:${port}/`
    : `http://localhost:${port}/?arg=${encodeURIComponent(sessionName)}`

  document.getElementById('ttyd-frame').src = url
  document.getElementById('terminal-overlay').classList.add('visible')
}

function closeTerminal() {
  document.getElementById('terminal-overlay').classList.remove('visible')
  document.getElementById('session-picker').classList.remove('visible')
  document.getElementById('ttyd-frame').src = 'about:blank'
  terminalState = null
  // Re-open the slide-over if there's a selected card
  if (selectedCard) {
    document.getElementById('panel-overlay').classList.add('visible')
  }
}

// ── Util ────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
}
