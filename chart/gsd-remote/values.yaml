# ─── GSD Remote Agent — Helm Values ──────────────────────────────────────────
# Install: helm install my-agent ./chart/gsd-remote -f my-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Project identifier — used as deployment name suffix and resource labels.
# e.g. "salesanalyzer" → deployment "gsd-salesanalyzer", pvc "gsd-salesanalyzer-workspace"
projectName: ""

# GitHub repo to clone into the workspace on first boot.
# e.g. "https://github.com/castai/oc-salesanalyzer-control.git"
gitRepo: ""

# Git branch to checkout (default: repo default branch)
gitBranch: ""

# ─── Secrets ─────────────────────────────────────────────────────────────────

# GitHub Personal Access Token — used for git clone, gh CLI, push/pull.
githubPAT: ""

# Kimchi (AI Enabler) API token — the "aie" provider key.
kimchiToken: ""

# Brave Search API key (optional)
braveAPIKey: ""

# Tavily Search API key (optional)
tavilyAPIKey: ""

# ─── Models ──────────────────────────────────────────────────────────────────

# Contents of models.json. Pass via --set-file modelsJSON=./models.json
modelsJSON: ""

# Contents of preferences.md. Pass via --set-file preferencesmd=./preferences.md
preferencesMD: ""

# ─── Project Environment ─────────────────────────────────────────────────────

# Contents of the project .env file. Pass via --set-file projectEnv=./path/to/.env
# Mounted at /workspace/project/.env after clone.
projectEnv: ""

# Additional environment variables injected into the container.
extraEnv: {}
  # DATABASE_URL: "postgresql://user:pass@host:5432/db"
  # SLACK_BOT_TOKEN: "xoxb-..."

# ─── Image ───────────────────────────────────────────────────────────────────

image:
  repository: us-central1-docker.pkg.dev/demos-321800/agents/gsd-remote
  tag: latest
  pullPolicy: Always

# ─── Resources (workstation-class) ───────────────────────────────────────────

resources:
  requests:
    cpu: "4"
    memory: 32Gi
  limits:
    cpu: "8"
    memory: 64Gi

# ─── Storage ─────────────────────────────────────────────────────────────────
#
# The PVC at /home/gsd holds:
#   - .gsd/              GSD agent state, models, skills, auth
#   - .npm-global/       @opengsd/gsd-pi and other npm tools (PVC-local, runtime-installed)
#   - .local/bin/        Kimchi harness (PVC-local, runtime-installed)
#   - workspace/         cloned repo + project .env
#
# Both @opengsd/gsd-pi and Kimchi harness are installed by the entrypoint
# into these PVC-backed directories on first boot if missing. They persist
# across pod restarts and can be updated in-pod without rebuilding the image:
#   npm install -g @opengsd/gsd-pi@latest
#   curl -fsSL https://github.com/getkimchi/kimchi/releases/latest/download/install.sh | bash

persistence:
  size: 50Gi
  storageClass: standard-rwo

# ─── Namespace ───────────────────────────────────────────────────────────────
#
# The namespace is NOT managed by this chart — it must exist before install.
# This is intentional: helm-owned namespaces get cascade-deleted by `helm uninstall`,
# which destroys PVCs in the namespace and any data on them. Keeping the namespace
# out of the chart means `helm uninstall` only removes the workload, not the data.
#
# Bootstrap once with: kubectl create namespace lk-gsd
# Or use --create-namespace on first `helm install` (helm will create but not own it
# in newer versions; for safety the deploy script handles this explicitly).

namespace: lk-gsd

# ─── RBAC (Kubernetes API Access) ────────────────────────────────────────────
#
# Enable to grant the pod admin-level cluster access.
# This allows gsd to manage pods, deployments, PVCs, etc from within the pod.
#
# WARNING: Only enable for dev environments. Production workloads should
# use more restrictive permissions (namespaced Roles instead of ClusterRole).
#
rbac:
  enabled: false  # Set to true to enable cluster admin access
